<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.ov{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--accent-laterite);display:flex;gap:10px;align-items:center}.ov b{font-family:var(--font-display);color:#B98A00}.ov i{width:20px;height:1px;background:#B98A00}.rule{height:3px;width:48px;background:var(--brand-band);margin-top:8px}.toghu{display:grid;gap:3px;margin-top:16px}.toghu span:nth-child(odd){height:1px;background:#B98A00;opacity:.6}.toghu span:nth-child(2){height:6px;background:var(--motif-toghu)}.m{display:grid;grid-template-columns:12px 88px 1fr;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--cm-gris-200);font-size:14px}.m i{width:12px;height:12px;box-sizing:border-box;border:2px solid #254A85;background:#254A85;display:block}.m .d{border-radius:50%}.m .t{background:var(--surface-card)}.m .p{transform:rotate(45deg) scale(.8)}.m code{font-family:var(--font-mono);color:#254A85;font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div><div class="ov"><b>II</b><i></i><span>Titre de section</span></div><h2 style="font:var(--type-h3);margin:6px 0 0">Filet tricolore 48 × 3</h2><div class="rule"></div><div class="toghu"><span></span><span></span><span></span></div><p style="font:var(--type-caption);color:var(--text-muted);margin-top:8px">Bande toghu entre deux filets or (#B98A00, 60 %) : séparateur de grandes sections.</p></div><div><div class="m"><i></i><code>1884</code><span>événement</span></div><div class="m"><i class="p"></i><code>1958</code><span>personnage</span></div><div class="m"><i class="d"></i><code>1961</code><span>traité, loi</span></div><div class="m"><i class="t"></i><code>1986</code><span>contour seul : tragique</span></div></div></
