class Garde extends React.Component{constructor(p){super(p);this.state={err:null};}static getDerivedStateFromError(e){return{err:e};}componentDidUpdate(p){if(p.k!==this.props.k&&this.state.err)this.setState({err:null});}render(){if(this.state.err)return <div style={{padding:'var(--space-12) var(--gutter)',maxWidth:720,margin:'0 auto'}}><h1 style={{font:'var(--type-h3)'}}>Cette page a rencontré un problème</h1><p style={{color:'var(--text-muted)',marginTop:8}}>Le reste du site fonctionne. Vous pouvez revenir à l’accueil ; l’incident a été enregistré.</p><a href="#" onClick={ev=>{ev.preventDefault();this.props.onHome();}} style={{display:'inline-block',marginTop:16}}>Retour à l’accueil</a></div>;return this.props.children;}}

</Garde></Shell>;}
