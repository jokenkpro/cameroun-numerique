<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cameroun numérique — le portail unifié de l’État</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../responsive.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style></head><body><div id="root"></div>
<script type="text/babel" src="../recherche.jsx"></script><script type="text/babel" src="../commun.jsx"></script><script type="text/babel" src="../dict/hub.jsx"></script><script type="text/babel" src="../dict/sites.jsx"></script><script type="text/babel" src="../dict/comptes.jsx"></script><script type="text/babel" src="../traduction.jsx"></script><script type="text/babel" src="../legal.jsx"></script><script type="text/babel" src="data.jsx"></script><script type="text/babel" src="shell.jsx"></script><script type="text/babel" src="accueil.jsx"></script><script type="text/babel" src="identite.jsx"></script><script type="text/babel" src="comptes.jsx"></script>
<script type="text/babel">
function App(){const [page,setPage]=React.useState(()=>(lireHash()||{}).page||'accueil');const [arg,setArg]=React.useState(()=>(lireHash()||{}).arg||'');const [tab,setTab]=React.useState('tdb');const [lang]=useLang();const [falc,setFalc]=React.useState(false);
const [user,setUserS]=React.useState(()=>{try{return JSON.parse(localStorage.getItem('cm-hub-user')||'null');}catch(e){return null;}});
const setUser=u=>{setUserS(u);localStorage.setItem('cm-hub-user',JSON.stringify(u));};
const go=(p,a='')=>{if((p==='citoyen'||p==='pro')&&!user){setPage('connexion');setArg(p);return;}setPage(p);setArg(a||'');setTab('tdb');ecrireHash(p,a);window.scrollTo(0,0);};
React.useEffect(()=>{const f=()=>{const h=lireHash();if(h){setPage(h.page);setArg(h.arg||'');}};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f);},[]);
return <Shell page={page} go={go} falc={falc} setFalc={setFalc} user={user} setUser={setUser}>
{page==='accueil'&&<Accueil go={go} falc={falc} user={user}/>}{page==='besoins'&&<Besoins go={go} query={arg}/>}{page==='besoin'&&<Besoin go={go} id={arg} user={user}/>}{page==='annuaire'&&<Annuaire go={go}/>}{page==='institution'&&<Institution go={go} id={arg}/>}{page==='identite'&&<Identite go={go}/>}{page==='connexion'&&<Connexion go={go} setUser={setUser} type={arg||'citoyen'}/>}{page==='citoyen'&&user&&<Citoyen go={go} tab={tab} setTab={setTab} setUser={setUser}/>}{page==='pro'&&user&&<Pro go={go} tab={tab} setTab={setTab} setUser={setUser}/>}{page==='communaute'&&<Communaute go={go}/>}{page==='relais'&&<Relais key={arg} go={go} focus={arg||null}/>}{page==='recherche'&&<RechercheP key={arg} go={go} query={arg}/>}{page==='legal'&&<LegalP key={arg} go={go} id={arg}/>}{page==='premiere'&&<PremiereConnexion go={go}/>}
</Shell>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
